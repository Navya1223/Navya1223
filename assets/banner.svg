<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Navya Geethika Namburi — Data Analyst, Power Platform and AI Agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:700 52px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#f8fafc}
      .role{font:500 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#a5b4fc;letter-spacing:.5px}
      .loc{font:400 17px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.4s ease-out both}
      .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}.b6{animation-delay:.75s}
      .trend{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2s .9s ease-out forwards}
      .dot{opacity:0;animation:pop .4s 2.7s forwards}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pop{to{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <text x="64" y="128" class="name">Navya Geethika Namburi</text>
  <text x="66" y="172" class="role">Data Analyst · Power BI · Power Platform · AI Agents</text>
  <text x="66" y="212" class="loc">M.Sc. Information Technology @ TH OWL  ·  Bielefeld, Germany</text>

  <g transform="translate(830,70)">
    <line x1="0" y1="170" x2="300" y2="170" stroke="#94a3b8" stroke-opacity=".35"/>
    <rect class="grow"    x="10"  y="110" width="32" height="60"  rx="5" fill="url(#bar)"/>
    <rect class="grow b2" x="58"  y="80"  width="32" height="90"  rx="5" fill="url(#bar)"/>
    <rect class="grow b3" x="106" y="95"  width="32" height="75"  rx="5" fill="url(#bar)"/>
    <rect class="grow b4" x="154" y="55"  width="32" height="115" rx="5" fill="url(#bar)"/>
    <rect class="grow b5" x="202" y="35"  width="32" height="135" rx="5" fill="url(#bar)"/>
    <rect class="grow b6" x="250" y="15"  width="32" height="155" rx="5" fill="url(#bar)"/>
    <polyline class="trend" points="26,98 74,66 122,80 170,40 218,22 266,4" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="266" cy="4" r="6" fill="#f472b6"/>
  </g>
</svg>
